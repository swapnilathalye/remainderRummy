name: Android

# Builds the Android app on GitHub's Linux runners. No Mac, no Android Studio,
# nothing installed on your own machine.
#
# Without any secrets set you get a debug APK you can sideload onto a phone.
# Add the four ANDROID_* secrets and you also get a signed .aab to upload to
# the Play Console. See README.md for how to make the keystore.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # needed to publish the APK as a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Check the rules engine
        run: npm test

      - name: Generate the native project
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#160f1c' \
            --splashBackgroundColor '#160f1c' || echo "no icon sources, carrying on"
          npx cap sync android

      - name: Build the debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: remainder-rummy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # An artifact needs a GitHub login and downloads as a zip, which is
      # painful on a phone. A release asset is a plain .apk on a public link,
      # so you can open it straight from the phone's browser and install it.
      - name: Publish the APK where a phone can reach it
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk remainder-rummy-debug.apk
          # Roll the same tag forward so the download link never changes.
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug remainder-rummy-debug.apk \
            --title "Latest debug build" \
            --prerelease \
            --notes "Debug build of \`${GITHUB_SHA:0:7}\`, built $(date -u '+%Y-%m-%d %H:%M UTC').

          Install it by opening this page on an Android phone and tapping the
          .apk below. Android will ask you to allow installs from your browser,
          and Play Protect will warn that the developer is unknown — that is
          expected for a debug build signed with a throwaway key.

          Not for the Play Store: that needs the signed .aab from a build with
          the keystore secrets set."

      # ---- everything below only runs if you have added the signing secrets ----

      - name: Prepare release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret, stopping after the debug build."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          node tools/android-signing.mjs
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the release bundle
        if: steps.signing.outputs.signed == 'true'
        env:
          RR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: remainder-rummy-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
