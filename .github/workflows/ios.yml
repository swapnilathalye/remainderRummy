name: iOS

# Builds the iOS app on GitHub's macOS runners, so you never need a Mac of
# your own. You do still need a paid Apple Developer account to sign it —
# that part cannot be worked around.
#
# Without secrets this compiles the app unsigned, which proves the project
# builds. With the four APPLE_* secrets it produces a signed .ipa.
#
# Codemagic (codemagic.yaml in this repo) does the same job with far less
# certificate wrangling. Use that first; keep this as the quick check that the
# project still compiles, which costs nothing on a public repository.
#
# Capacitor 8 builds iOS with Swift Package Manager, not CocoaPods: there is
# no Podfile and no .xcworkspace, only ios/App/App.xcodeproj plus a local
# package in ios/App/CapApp-SPM. Anything you read online about `pod install`
# for Capacitor applies to version 7 and earlier.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    # macos-14 was retired on 2 November 2026. `macos-latest` tracks whatever
    # GitHub currently supports, so this workflow will not quietly die the next
    # time an image is retired — a job on a dead label is cancelled instantly
    # with no runner and no error you can read.
    # The trade-off is that Xcode can change underneath you. If you need a
    # reproducible release build, pin `macos-15` instead and update it
    # deliberately when GitHub announces the next retirement.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'      # the Capacitor 8 CLI refuses anything lower

      - name: Install dependencies
        run: |
          source .github/workflows/retry.sh
          retry npm install

      - name: Check the rules engine
        run: npm test

      - name: Generate the native project
        run: |
          source .github/workflows/retry.sh
          retry npx cap add ios
          npx capacitor-assets generate --ios \
            --iconBackgroundColor '#160f1c' \
            --splashBackgroundColor '#160f1c' || echo "no icon sources, carrying on"
          retry npx cap sync ios
          echo "--- what xcodebuild can see in this project ---"
          xcodebuild -list -project ios/App/App.xcodeproj || true

      - name: Build unsigned (proves the project compiles)
        run: |
          set -o pipefail
          source "$GITHUB_WORKSPACE/.github/workflows/retry.sh"
          cd ios/App
          # Capacitor's template ships no shared scheme. Xcode usually creates
          # one on demand, but if it has not, fall back to building the target
          # directly so the job reports a real compile result either way.
          SCHEMES=$(xcodebuild -list -project App.xcodeproj 2>/dev/null \
            | awk '/Schemes:/{found=1; next} found {print $1}')
          echo "Schemes available: ${SCHEMES:-none}"
          if echo "$SCHEMES" | grep -qx "App"; then
            SELECT="-scheme App"
          else
            echo "No scheme named App; building the App target directly."
            SELECT="-target App"
          fi
          # xcpretty only tidies the log, so fall back to raw output.
          if command -v xcpretty >/dev/null 2>&1; then FORMAT=xcpretty; else FORMAT=cat; fi
          # No `|| true` here on purpose: if Xcode cannot build this project we
          # want the job to go red, not to pass quietly and mislead us.
          # Retried twice because Swift Package Manager resolution reaches the
          # network; a genuine compile error simply fails twice and goes red.
          build_it () {
            xcodebuild -project App.xcodeproj $SELECT \
              -configuration Release -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
              build | $FORMAT
          }
          retry 2 build_it

      # ---- everything below only runs if you have added the signing secrets ----

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_P12_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No signing secrets set, stopping after the unsigned build."
            exit 0
          fi
          KEYCHAIN=build.keychain
          security create-keychain -p runner $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p runner $KEYCHAIN
          security set-keychain-settings -t 3600 -u $KEYCHAIN
          echo "$CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k $KEYCHAIN -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner $KEYCHAIN
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Archive and export the ipa
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios/App
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # Archiving needs a scheme; there is no building a target instead.
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" archive
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'true'
        with:
          name: remainder-rummy-ipa
          path: ios/App/build/ipa/*.ipa
