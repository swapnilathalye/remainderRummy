<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="room" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#4e2d48"/><stop offset="1" stop-color="#160f1c"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ec"/><stop offset="1" stop-color="#eadfc4"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a63"/><stop offset="1" stop-color="#1b2645"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#room)"/>
  <!-- motif kept inside the middle 70% so round and squircle masks do not bite -->
  <g transform="translate(512 512) scale(0.88)">
    <g transform="rotate(-20) translate(-250 -224)">
      <rect width="300" height="430" rx="34" fill="url(#back)" stroke="#e0b05a" stroke-width="12"/>
      <rect x="34" y="34" width="232" height="362" rx="18" fill="none" stroke="#e0b05a" stroke-opacity=".5" stroke-width="9"/>
    </g>
    <g transform="rotate(7) translate(-78 -236)">
      <rect width="320" height="458" rx="36" fill="url(#card)"/>
      <rect x="18" y="18" width="284" height="422" rx="22" fill="none" stroke="#1d1826" stroke-opacity=".2" stroke-width="8"/>
      <text x="160" y="268" font-family="Georgia,'Times New Roman',serif" font-size="300" font-weight="bold"
            fill="#b3202e" text-anchor="middle">&#247;</text>
      <text x="160" y="392" font-family="Georgia,'Times New Roman',serif" font-size="92"
            fill="#b3202e" text-anchor="middle">&#9830;</text>
    </g>
  </g>
</svg>
